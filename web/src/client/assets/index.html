<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, interactive-widget=resizes-content"
    />
    <title>VibeTunnel - Terminal Multiplexer</title>
    <meta
      name="description"
      content="Interactive terminal sessions in your browser with real-time streaming and mobile support"
    />

    <!-- PWA and mobile optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Home-screen label: without it iOS offers the full <title> and truncates it -->
    <meta name="apple-mobile-web-app-title" content="VibeTunnel" />
    <meta name="application-name" content="VibeTunnel" />
    <meta name="theme-color" content="#1e1e1e" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- Single high-res Apple/Android/Web App icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (important for iOS/Android home screen apps) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Styles, without holding the first paint: as media="print" it is fetched but never
         blocks rendering, and the script below applies it once it has loaded. Until then the
         app stays hidden behind the boot screen (no flash of an unstyled app). -->
    <link rel="preload" href="/bundle/styles.css" as="style" />
    <link id="vt-styles" href="/bundle/styles.css" rel="stylesheet" media="print" />
    <script>
(() => {
  const link = document.getElementById('vt-styles');
  // A failed load shows the app unstyled rather than a boot screen that never goes away.
  const apply = () => {
    link.media = 'all';
    document.documentElement.setAttribute('data-vt-styles', '');
  };
  if (link.sheet) apply();
  else {
    link.addEventListener('load', apply, { once: true });
    link.addEventListener('error', apply, { once: true });
  }
})();
</script>
    <!-- The app's code, fetched and compiled while the head is still being parsed (its
         <script> is at the end of <body>) -->
    <link rel="modulepreload" href="/bundle/client-bundle.js" />

    <!-- Mobile viewport and address bar handling -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100); /* Dynamic viewport height for mobile */
        height: 100dvh; /* Use dynamic viewport height for better keyboard handling */
        /* Home-screen app on iPhone: innerHeight (and 100dvh) come up short by the status bar,
           so the script at the end of <body> sets --app-height to the screen height; without
           this the rule above wins and leaves a blank band under the page. Everywhere else
           --app-height is 100dvh (styles.css). */
        height: var(--app-height, 100dvh);
        overscroll-behavior-y: none; /* Prevent pull-to-refresh */
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent pull-to-refresh only on specific elements */
      body {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Enable pinch-zoom on terminal components while preventing pan */
      vibe-terminal {
        touch-action: pinch-zoom;
      }

      /* Ensure app takes full viewport */
      vibetunnel-app {
        display: block;
        width: 100%;
        min-height: 100%;
      }
      /* The first frame's colours with nothing loaded: the theme script below sets the same
         on <html>; this covers storage being blocked. */
      html {
        background-color: #0a0a0a;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) {
          background-color: #fafafa;
        }
      }
      html[data-theme='light'] {
        background-color: #fafafa;
      }
      /* Hidden (still laid out) until styles.css applies: see the script after its <link>. */
      html:not([data-vt-styles]) vibetunnel-app {
        visibility: hidden;
      }
      /* Until the app's script runs and its styles apply (seconds on a phone or a slow link)
         the page was blank and looked broken: the icon and a spinner. Everything it needs is in
         this page, so it paints as soon as the HTML arrives, with no fade-in. Gone once
         <vibetunnel-app> is defined and styled. */
      #vt-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        pointer-events: none;
      }
      html[data-vt-styles] vibetunnel-app:defined ~ #vt-boot {
        display: none;
      }
      #vt-boot img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      #vt-boot .vt-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(127, 127, 127, 0.25);
        border-top-color: rgba(127, 127, 127, 0.85);
        animation: vt-boot-spin 0.8s linear infinite;
      }
      @keyframes vt-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Import Maps -->
    <script type="importmap">
      {
        "imports": {
          "lit": "https://cdn.skypack.dev/lit",
          "lit/": "https://cdn.skypack.dev/lit/"
        }
      }
    </script>
    
    <!-- Initialize theme immediately to prevent flash -->
    <script>
      (function() {
        // Load saved theme preference or use system preference
        const saved = localStorage.getItem('vibetunnel-theme');
        const theme = saved || 'system';
        
        // Apply theme immediately
        if (theme === 'system') {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        
        // Apply immediate background to prevent flash
        const effectiveTheme = theme === 'system' 
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme;
        
        // Set initial background color
        document.documentElement.style.backgroundColor = effectiveTheme === 'dark' ? '#0a0a0a' : '#fafafa';

        // Color theme (utils/accent-themes.ts) before first paint
        try {
          const accent = localStorage.getItem('vibetunnel-accent');
          if (accent) document.documentElement.setAttribute('data-accent', accent);
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="m-0 p-0 bg-bg text-text">
    <vibetunnel-app></vibetunnel-app>
    <div id="vt-boot" aria-hidden="true">
      <!-- 64 pt: the 192 px icon is sharp at 3x and 43 KB, the 512 px one 195 KB -->
      <img src="/icon-192.png" alt="" />
      <div class="vt-boot-spinner"></div>
    </div>

    <!-- Mobile viewport height fix -->
    <script>
      // Check if mobile device
      // NOTE: This detection logic must match detectMobile() in src/client/utils/mobile-utils.ts
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || 
                       (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

      // Handle viewport height - set only once on mobile to prevent resize loops
      function setViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }

      // Set initial height
      setViewportHeight();

      // Home-screen web app on iPhone: innerHeight comes up short by the status bar height
      // (black-translucent), leaving a blank band at the bottom of every page. The session
      // view keeps --app-height current (keyboard included); this covers the other pages.
      // Same rule as iosStandaloneShortfall() (utils/app-height.ts): iPhone standalone,
      // portrait, a status-bar sized gap.
      (() => {
        const gap = window.screen.height - window.innerHeight;
        if (
          navigator.standalone === true &&
          /iPhone|iPod/.test(navigator.userAgent) &&
          window.innerWidth < window.innerHeight &&
          gap > 0 &&
          gap <= 80
        ) {
          document.documentElement.style.setProperty('--app-height', `${window.screen.height}px`);
        }
      })();

      // On mobile, we only set viewport height once to prevent resize loops
      // On desktop, we still allow dynamic resizing
      if (!isMobile) {
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', () => {
          setTimeout(setViewportHeight, 100);
        });
      }

      // Force full-screen behavior
      window.addEventListener('load', () => {
        // Scroll to top to hide address bar
        setTimeout(() => {
          window.scrollTo(0, 1);
          setTimeout(() => window.scrollTo(0, 0), 10);
        }, 10);
      });
    </script>

    <script type="module" src="/bundle/client-bundle.js"></script>
  </body>
</html>
